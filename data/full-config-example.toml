# Every wlRIX setting the settings daemon knows about, at its declared default.
#
# Generated by `wlrix-settings-daemon --dump-schema`. Not a config file to install:
# each block below belongs in a different file, and settings with no default are
# commented out because absent and empty do not mean the same thing.

# ---- background.toml ----
# Wallpaper
# image =    # no default; unset by default
# How the wallpaper is fitted
mode = "fill"
# Desktop color
color = "#555555"

# ---- bluetooth.toml ----
# Show the Bluetooth icon in the tray
indicator = "auto"
# Warn when a device's battery is low
battery_warnings = true

# ---- clipboard.toml ----
# How many entries the clipboard history keeps
max_entries = 50
# Keep the clipboard history after logging out
persist = true
# Keep what was copied after the program closes
keep_clipboard_full = true
# Largest copy recorded, in bytes
max_entry_bytes = 16777216

# ---- compositor.toml ----

[keyboard]
# xkb rules file
# rules =    # no default; unset by default
# Keyboard model
# model =    # no default; unset by default
# Keyboard layout
# layout =    # no default; unset by default
# Layout variant
# variant =    # no default; unset by default
# xkb options
# options =    # no default; unset by default
# Repeat delay
repeat_delay = 200
# Repeat rate
repeat_rate = 25

[focus]
# Focus policy
policy = "click"
# Clicking a window raises it
raise_on_click = true

[windows]
# Show window contents while moving
opaque_move = true
# Show window contents while resizing
opaque_resize = true

[cursor]
# Cursor theme
# theme =    # no default; unset by default
# Cursor size
# size =    # no default; unset by default

[mouse]
# Mouse acceleration
acceleration = 0.0
# Left-handed mouse
left_handed = false
# Double-click time
double_click_ms = 400

[touchpad]
# Touchpad acceleration
acceleration = 0.0
# Tap to click
tap = true
# Tap and drag
tap_drag = true
# Drag lock
drag_lock = false
# Natural scrolling
natural_scroll = false
# Disable while typing
disable_while_typing = true
# Touchpad scrolling
# scroll =    # no default; unset by default
# Touchpad secondary click
# secondary_click =    # no default; unset by default
# Turn off the touchpad while a mouse is connected
disable_with_mouse = false

[idle]
# Blank the screen after (deprecated)
# blank_after_secs =    # no default; unset by default

[appearance]
# Color scheme
# palette =    # no default; unset by default

# ---- desktop.toml ----
# Snap icons to a grid
snap_to_grid = false
# Monitor for desktop icons
# output =    # no default; unset by default
# Command that opens a file
open = []
# Terminal for Terminal=true launchers
terminal = []

[metrics]
# Icon size
icon = 64
# Cell width
cell_width = 96
# Cell height
cell_height = 104
# Gap between cells
gap = 8
# Margin at the screen edge
margin = 12

[appearance]
# Color scheme
# palette =    # no default; unset by default
# Icon theme an Icon= name is looked up in
icon_theme = "wlrix"

# ---- files.toml ----

[navigation]
# What opening a folder does
mode = "modern"

[appearance]
# Icon theme the listing draws from
icon_theme = "wlrix"

# ---- idle.toml ----

[plugged_in]
# Dim the screen after (plugged in)
dim_after_secs = 0
# Turn the screen off after (plugged in)
screen_off_after_secs = 0
# Lock as the screen turns off (plugged in)
lock = true
# Sleep after (plugged in)
suspend_after_secs = 0

[on_battery]
# Dim the screen after (on battery)
dim_after_secs = 0
# Turn the screen off after (on battery)
screen_off_after_secs = 0
# Lock as the screen turns off (on battery)
lock = true
# Sleep after (on battery)
suspend_after_secs = 0

[lock]
# Screen locker
command = "wlrix-lock"

[before_sleep]
# Lock before suspending
lock = true
# Blank before suspending
blank = false
# Command to run before suspending
# command =    # no default; unset by default
# How long to hold suspend back
timeout_secs = 4

[lid]
# When the lid is closed on battery
on_battery = "suspend"
# When the lid is closed while plugged in
on_ac = "suspend"
# When the lid is closed with another monitor
docked = "nothing"

[gamepad]
# Count controller input as activity
enable = true
# Stick deadzone
deadzone = 0.25
# Least time between reports
min_interval_ms = 1000
# Only these controllers
allow = []
# Never these controllers
deny = []
# Controllers to use regardless
devices = []

[dbus]
# Serve org.freedesktop.ScreenSaver
screensaver = true
# Serve org.freedesktop.PowerManagement.Inhibit
power_management = true
# Take logind's sleep and lid inhibitors
logind = true
# Take the bus names from whoever holds them
replace = false

# ---- lock.toml ----
# Blur behind the lock screen
blur = 0

[appearance]
# Color scheme
# palette =    # no default; unset by default

[clock]
# Clock format
time_format = "%H:%M"
# Date format
# date_format =    # no default; unset by default

[background]
# Lock screen wallpaper
# image =    # no default; unset by default
# How the lock screen wallpaper is fitted
mode = "fill"
# Lock screen color
color = "#555555"

# ---- network.toml ----
# Show the Wi-Fi icon in the tray
indicator = "auto"

# ---- osd.toml ----
# Which monitor notifications appear on
# output =    # no default; unset by default
# Which corner notifications stack in
anchor = "top-right"
# Notifications on screen at once
max_visible = 5
# Notification width
width = 360

[timeout]
# How long a low-urgency notification stays
low = 5
# How long a notification stays
normal = 8
# How long a critical notification stays
critical = 0

[appearance]
# Color scheme
# palette =    # no default; unset by default
# Icon theme an icon name is looked up in
icon_theme = "wlrix"

[metrics]
# Picture size
icon = 48
# Gap between notifications
gap = 6
# Distance from the screen edges
margin = 12
# Lines of body text
body_lines = 6

[bar]
# How long the volume and brightness bar stays
duration = 1.5

[keys]
# Volume step per key press, in percent
volume_step = 5
# The loudest the volume keys go, in percent
volume_max = 100
# Brightness step per key press, in percent
brightness_step = 5
# Click as the volume changes
sound = true

# ---- portal.toml ----

[preview]
# Preview refresh interval
tick_ms = 100

[appearance]
# Color scheme
# palette =    # no default; unset by default
# Icon theme toolkits are told to use
icon_theme = "wlrix"

# ---- power.toml ----
# Show the battery icon in the tray
indicator = "auto"
# Warn when the battery is low
warnings = true

# ---- screenshot.toml ----

[save]
# Where screenshots are saved
# dir =    # no default; unset by default
# Filename template
filename = "Screenshot_%Y-%m-%d_%H-%M-%S"

[capture]
# Draw the pointer into the shot
cursor = false

[appearance]
# Color scheme
# palette =    # no default; unset by default
# How far the unselected area is darkened
dim = 0.55

# ---- session.toml ----
# Compositor to run
# compositor =    # no default; unset by default

# ---- sounds.toml ----
# Play system sounds
enabled = true
# Sound theme
theme = "wlrix"
# Muted sounds
disabled = []
# Play desktop sounds through
# output =    # no default; unset by default

[play]
# Startup & Shutdown Tunes
startup = false
# Desktop Sounds
desktop = true
# Window Sounds
windows = false
# System Alerts Sounds
alerts = true
# Keyboard Bell
bell = true

# ---- tray.toml ----
# Which monitor the tray is on
# output =    # no default; unset by default
# Which corner the tray docks in
anchor = "bottom-left"
# Which way the strip runs
orientation = "horizontal"
# Show items that are not asking for attention
show_passive = false
# Disappear when there is nothing to show
hide_when_empty = true

[appearance]
# Color scheme
# palette =    # no default; unset by default
# Icon theme an item's IconName is looked up in
icon_theme = "wlrix"

[metrics]
# Icon size
icon = 22
# Cell size
cell = 28
# Gap between cells
gap = 2
# Distance from the screen edges
margin = 8
# Cells per run before the strip wraps
wrap_at = 8
